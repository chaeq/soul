<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee2cf"><title>SOUL Moroccan Kitchen & Lounge Menu</title><style>*{box-sizing:border-box}html,body{margin:0;background:#eee2cf}.pages{width:100%;max-width:900px;margin:0 auto;padding:0}.page{display:block;width:100%;height:auto;margin:0;border:0}.loading{padding:40px;text-align:center;font-family:Georgia,serif;color:#2f281f}</style></head><body><main class="pages" id="pages"><div class="loading" id="loading">Loading menu…</div></main><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const pages=document.getElementById('pages');const loading=document.getElementById('loading');try{const pdf=await pdfjsLib.getDocument('SOUL%20Menu.pdf').promise;loading.remove();for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n);const base=page.getViewport({scale:1});const target=Math.min(1800,Math.max(900,window.innerWidth*2));const scale=target/base.width;const viewport=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.className='page';canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);canvas.style.width='100%';canvas.style.height='auto';pages.appendChild(canvas);const ctx=canvas.getContext('2d',{alpha:false});await page.render({canvasContext:ctx,viewport}).promise;}}catch(e){loading.textContent='Menu failed to load. Please refresh the page.';console.error(e);}</script></body></html>
